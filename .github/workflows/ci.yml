name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Install Poetry
      uses: snok/install-poetry@v1.4.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: poetry install
    - name: Run tests
      run: poetry run make test
    - name: Run linters
      run: poetry run make lint
    - name: Audit dependencies
      run: poetry run make audit
    - name: Build package
      run: poetry build

  minimum-dependencies:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Poetry
      uses: snok/install-poetry@v1.4.2
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
    - name: Build package
      run: poetry build
    - name: Install minimum direct dependencies
      run: |
        uv venv -p 3.13 .venv-min
        VIRTUAL_ENV=.venv-min uv pip install --resolution lowest-direct --only-binary :all: \
          dist/*.whl "pydantic>=2.8.0" "PyYAML>=6.0.2" "click>=8.0.0" "pytest>=8"
        VIRTUAL_ENV=.venv-min uv pip list
    - name: Run tests
      run: .venv-min/bin/python -m pytest tests/

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'

    steps:
    - uses: actions/checkout@v7
    - name: Install Poetry
      uses: snok/install-poetry@v1.4.2
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: poetry install
    - name: Build and publish
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
      run: |
        poetry build
        poetry publish
